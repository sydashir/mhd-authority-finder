[project]
name = "authority-finder"
version = "0.1.0"
description = "Per-geo discovery of .gov / .edu / high-authority sites for MHD + AH backlink outreach."
requires-python = ">=3.12,<3.13"
readme = "README.md"
authors = [{ name = "Syed Ashir" }]
dependencies = [
    "alembic>=1.13,<2",
    "anthropic>=0.120.2",
    "apscheduler>=3.11,<4.0",
    "click==8.4.1",
    "fastapi==0.138.2",
    "google-api-python-client==2.197.0",
    "google-auth==2.55.0",
    "httpx==0.28.1",
    "lxml==6.1.1",
    "phonenumbers==9.0.32",
    "playwright==1.60.0",
    "psycopg[binary]>=3.1,<4",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "pyjwt==2.13.0",
    "sentry-sdk[fastapi]>=2.65.0",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "structlog==25.5.0",
    "tenacity==9.1.4",
    "tldextract==5.3.1",
    "uvicorn[standard]==0.49.0",
]

[dependency-groups]
dev = [
    "pyright==1.1.409",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "ruff==0.15.13",
    "testcontainers[postgres]>=4,<5",
    "types-lxml==2026.2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/authority_finder"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "backend"]
# Alembic autogenerates migration files in its own (older-typing) style; don't lint them.
# .claude holds vendored tool/skill scripts (installed locally), not project code.
extend-exclude = ["alembic/versions", ".claude"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
    "ASYNC",  # flake8-async
    "PTH",    # use pathlib over os.path
    "TCH",    # type-checking import hygiene
    "TID",    # tidy imports
    "PL",     # pylint subset
    "RET",    # flake8-return
    "ARG",    # unused arguments
    "C4",     # comprehensions
    "PIE",    # misc lints
    "N",      # pep8-naming
]
ignore = [
    "PLR0913",  # too-many-arguments — pipelines naturally take wide inputs
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "PLR2004",  # magic numbers fine in tests
    "ASYNC240", # sync pathlib on tmp_path in async tests doesn't block anything that matters
]

[tool.ruff.lint.isort]
known-first-party = ["authority_finder", "backend"]

[tool.ruff.lint.flake8-type-checking]
# SQLAlchemy resolves Mapped[...] annotations at runtime, so date/datetime/etc. used only in
# model annotations must stay imported at module level (not moved into a TYPE_CHECKING block).
runtime-evaluated-base-classes = ["sqlalchemy.orm.DeclarativeBase"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
include = ["src", "tests", "backend"]
extraPaths = ["."]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not live and not live_paid"]
markers = [
    "live: hits real external services (MHD/AH sitemaps, real browser). Free traffic only. Skipped by default; opt in with `pytest -m live`.",
    "live_paid: spends real SerpAPI quota (billed searches). Excluded from default runs and from `-m live`; opt in with `pytest -m live_paid`.",
]
