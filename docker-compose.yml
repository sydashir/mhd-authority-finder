# Run the scheduler in a container: `docker compose up -d` (see README).
# Secrets are mounted read-only at runtime — NEVER baked into the image (a secret in an
# image layer leaks; we learned that the hard way, ADR-008). State + SerpAPI cache + output
# are bind-mounted to the host ./data so they survive restarts AND so the container reuses the
# already-known monitor state — a restart never re-processes already-seen geos (cost-safety,
# ADR-012). For a fully host-decoupled deploy, swap ./data for a named/cloud volume (it then
# starts empty and processes the existing backlog at MAX_NEW_GEOS_PER_RUN per tick).
services:
  # Postgres source-of-truth for the SaaS (ADR-013). Local dev DB; a named volume persists
  # data across restarts. Credentials come from .env (never baked into any image).
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-authority}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-authority}
      POSTGRES_DB: ${POSTGRES_DB:-authority}
    ports:
      # Host 5433 (5432 is commonly taken by another local Postgres); container port stays 5432.
      - "5433:5432"
    volumes:
      - authority-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-authority} -d ${POSTGRES_DB:-authority}"]
      interval: 5s
      timeout: 5s
      retries: 10

  scheduler:
    # DISABLED 2026-08-10. The client re-laid out the master Sheet (inserted a column, which
    # shifted Geo Served off the index the writer reads positionally, and added two formula
    # columns). Until the writer is name-based and writes to its own tab, an automatic run
    # either fails after Postgres has already advanced — leaving DB and Sheet diverged — or,
    # on a large enough run, rewrites the tab and silently breaks his formulas.
    #
    # The profile is the disarm: `docker compose up -d` will NOT start this service. It takes
    # an explicit `docker compose --profile scheduler up -d` to bring it back, so nothing
    # fires by accident. Remove this profiles block to re-enable.
    profiles: ["scheduler"]
    build: .
    image: mhd-authority-finder:latest
    restart: unless-stopped
    env_file:
      # .env is ALSO auto-loaded by Compose for ${VAR} substitution, and that pass expands the
      # $ characters inside the scrypt hash ($OXY... vanished, truncating AUTH_USERS from 92 to
      # 78 chars and silently breaking container login). secrets.env is referenced ONLY here,
      # so Compose passes it through verbatim. Listed last so it wins.
      - .env
      - secrets.env
    environment:
      # Container chromium can't use the setuid sandbox; force --no-sandbox regardless of .env.
      PLAYWRIGHT_NO_SANDBOX: "1"
      # In-container the DB is reached by the compose service name, not localhost.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-authority}:${POSTGRES_PASSWORD:-authority}@postgres:5432/${POSTGRES_DB:-authority}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./service-account.json:/app/service-account.json:ro
      - ./data:/app/data

  # The API, so a container login can be proven end to end (the scrypt hash in AUTH_USERS
  # contains $ and Compose expands those unless they are escaped in secrets.env).
  api:
    build: .
    image: mhd-authority-finder:latest
    restart: unless-stopped
    entrypoint: ["/app/.venv/bin/uvicorn", "backend.app:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
      - secrets.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-authority}:${POSTGRES_PASSWORD:-authority}@postgres:5432/${POSTGRES_DB:-authority}
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./service-account.json:/app/service-account.json:ro

volumes:
  authority-pgdata:
